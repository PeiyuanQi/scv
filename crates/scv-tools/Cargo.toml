[package]
name = "scv-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-scoped filesystem, process, skill, and agent tools for SCV"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
cap-std.workspace = true
futures-util.workspace = true
html2text.workspace = true
libc.workspace = true
reqwest.workspace = true
scv-client.workspace = true
scv-core.workspace = true
scv-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
which.workspace = true

[features]
# Hooks with which other crates' tests drive the background job store's
# delivery of reviewed jobs' outcomes. Only those tests enable it; no build
# of SCV itself does.
test-support = []

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
