[package]
name = "scv-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chat and mail channels for the SCV daemon: WeChat, Feishu/Lark, Slack, and mail triage with approval-gated mail actions"
repository.workspace = true

[lints]
workspace = true

[features]
default = ["wechat", "feishu", "slack", "email"]
# WeChat through a ClawBot (iLink) bot.
wechat = ["dep:aes", "dep:md-5", "dep:base64", "dep:reqwest"]
# Feishu and Lark through a bot app on the event long connection.
feishu = ["dep:prost", "dep:qrcode", "dep:reqwest", "dep:tokio-tungstenite", "futures-util/sink"]
# Slack through the Events API over Socket Mode.
slack = ["dep:reqwest", "dep:tokio-tungstenite", "futures-util/sink"]
# Mail: IMAP, the Gmail API, or Microsoft Graph, triaged and reported to a
# mail chat, with drafts, sends, and mailbox changes the owner approves.
email = ["dep:encoding_rs", "dep:html2text", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:base64", "dep:reqwest"]

[dependencies]
aes = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
base64 = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
futures-util.workspace = true
html2text = { workspace = true, optional = true }
libc.workspace = true
md-5 = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
scv-client.workspace = true
scv-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
uuid.workspace = true
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
