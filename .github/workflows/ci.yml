name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, 1.88.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace builds scv-channels with every channel; check each
      # channel alone, mail with one chat channel, and none, as other users
      # of the crate may build it.
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features -- -D warnings
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features --features wechat -- -D warnings
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features --features feishu -- -D warnings
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features --features slack -- -D warnings
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features --features email -- -D warnings
      - run: cargo clippy -p scv-channels --all-targets --locked --no-default-features --features email,feishu -- -D warnings
      - run: cargo test -p scv-channels --lib --locked --no-default-features --features email
      - run: git diff --check

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
