[package]
name = "scv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A small, extensible terminal agent runtime with a TUI and headless server"
repository = "https://github.com/PeiyuanQi/scv"
readme = "README.md"
keywords = ["agent", "coding-agent", "terminal", "tui", "llm"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/PeiyuanQi/scv"
# Agent skills are repository tooling, not part of the published crate.
exclude = [".agents/", ".claude/"]

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not pay for themselves here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
unreadable_literal = "allow"
struct_field_names = "allow"
doc_markdown = "allow"
verbose_bit_mask = "allow"
# Next ratchet (docs/quality.md): these still have hits that need a
# hand-written change each. Remove one line at a time with its cleanup.
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
format_collect = "allow"
format_push_string = "allow"
items_after_statements = "allow"
large_futures = "allow"
large_stack_arrays = "allow"
match_same_arms = "allow"
missing_fields_in_debug = "allow"
needless_pass_by_value = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unnecessary_debug_formatting = "allow"
unused_self = "allow"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
dbg_macro = "deny"
todo = "deny"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/PeiyuanQi/scv"

[workspace.dependencies]
aes = "0.8.4"
base64 = "0.22.1"
anyhow = "1.0.99"
async-trait = "0.1.89"
cap-std = "3.4.4"
clap = { version = "4.5.47", features = ["derive", "env"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
criterion = "0.5.1"
dirs = "6.0.0"
futures-util = "0.3.31"
html2text = "0.17.1"
libc = "0.2.175"
md-5 = "0.10.6"
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.9.5"
toml_edit = "0.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
which = "8.0.0"

scv-core = { version = "=0.3.1", path = "crates/scv-core" }
scv-client = { version = "=0.3.1", path = "crates/scv-client" }
scv-channels = { version = "=0.3.1", path = "crates/scv-channels" }
scv-protocol = { version = "=0.3.1", path = "crates/scv-protocol" }
scv-provider-openai = { version = "=0.3.1", path = "crates/scv-provider-openai" }
scv-server = { version = "=0.3.1", path = "crates/scv-server" }
scv-tools = { version = "=0.3.1", path = "crates/scv-tools" }
scv-tui = { version = "=0.3.1", path = "crates/scv-tui" }

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
libc.workspace = true
scv-server.workspace = true
scv-channels.workspace = true
scv-client.workspace = true
scv-protocol.workspace = true
scv-tools.workspace = true
scv-tui.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
criterion.workspace = true
scv-core.workspace = true
scv-protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "runtime"
harness = false

[[bin]]
name = "scv"
path = "src/main.rs"

[[bin]]
name = "scv-server"
path = "src/bin/scv-server.rs"
# Only `main` lives here; `src/cli/common.rs` is tested with the `scv` binary.
test = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 1
